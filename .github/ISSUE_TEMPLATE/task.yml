name: Tarea del sprint
description: Una fila del backlog de docs/sprints/sprint-N.md.
title: "SN-NN: "
labels: []
body:
  - type: input
    id: task_id
    attributes:
      label: ID
      description: Identificador del backlog, por ejemplo S1-01.
      placeholder: S1-01
    validations:
      required: true
  - type: dropdown
    id: sprint
    attributes:
      label: Sprint
      options: ["Sprint 1", "Sprint 2", "Sprint 3", "Sprint 4"]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Qué hay que hacer y por qué.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Archivos exclusivos
      description: Únicos archivos que puede tocar quien implemente la tarea.
      placeholder: "- src/nnsim/generators/lcg.py\n- tests/generators/test_lcg.py"
    validations:
      required: true
  - type: textarea
    id: depends
    attributes:
      label: Dependencias
      placeholder: "Depende de: #N"
  - type: textarea
    id: criteria
    attributes:
      label: Criterios de aceptación (Dado / Cuando / Entonces)
      description: Cada criterio necesita al menos un test test_<id>_<comportamiento>.
      placeholder: "- [ ] Dado ..., cuando ..., entonces ..."
    validations:
      required: true
  - type: dropdown
    id: chapter
    attributes:
      label: Capítulo de la cátedra
      multiple: true
      options: ["Cap. 1", "Cap. 2", "Cap. 3", "Cap. 4", "Cap. 5", "Cap. 6", "Cap. 7"]
  - type: dropdown
    id: type
    attributes:
      label: Tipo
      options: ["TDD núcleo", "TDD (validación)", "Experimento", "Docs", "Revisión", "Release", "CI"]
    validations:
      required: true
